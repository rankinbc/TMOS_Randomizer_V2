name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/TMOS_Randomizer_V2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package with test deps
        run: |
          pip install -e .[all]
          pip install -e ../TMOS_Strategy_Lab  # repair tests import tmos_strategy_lab

      - name: Run pytest
        run: pytest tests/ --ignore=tests/test_rendering -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/TMOS_Randomizer_V2/ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: projects/TMOS_Randomizer_V2/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 31 pre-existing lint errors (mostly no-explicit-any); non-blocking
      # until that debt is paid, then remove continue-on-error.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Run vitest
        run: npm test
