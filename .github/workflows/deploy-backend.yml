name: Deploy Backend to Azure App Service

on:
  push:
    branches: [master]
    paths:
      - 'projects/TMOS_Randomizer_V2/src/**'
      - 'projects/TMOS_Randomizer_V2/config/**'
      - 'projects/TMOS_Randomizer_V2/pyproject.toml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tmos-randomizer-api  # ← set to your App Service resource name

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: projects/TMOS_Randomizer_V2
