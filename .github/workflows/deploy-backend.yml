name: Deploy Backend to Azure App Service

on:
  push:
    branches: [master]
    paths:
      - 'projects/TMOS_Randomizer_V2/src/**'
      - 'projects/TMOS_Randomizer_V2/config/**'
      - 'projects/TMOS_Randomizer_V2/pyproject.toml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: tmos-randomizer-api
  AZURE_RESOURCE_GROUP: tmos-randomizer-rg

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Pack only what the backend needs — exclude ROM, UI, debug scripts, etc.
      - name: Build deployment zip
        run: |
          mkdir -p /tmp/deploy-pkg
          cp -r projects/TMOS_Randomizer_V2/src      /tmp/deploy-pkg/
          cp -r projects/TMOS_Randomizer_V2/config   /tmp/deploy-pkg/
          cp    projects/TMOS_Randomizer_V2/pyproject.toml /tmp/deploy-pkg/
          cp    projects/TMOS_Randomizer_V2/requirements.txt /tmp/deploy-pkg/
          cd /tmp/deploy-pkg
          find . -name '__pycache__' -prune -o -name '*.pyc' -prune -o -type f -print | zip /tmp/deploy.zip -@
          echo "Zip size: $(du -sh /tmp/deploy.zip)"

      # Deploy via Kudu zip API with Bearer token — avoids az webapp deploy CLI
      # which hangs indefinitely regardless of --async setting.
      - name: Deploy to App Service via Kudu API
        run: |
          TOKEN=$(az account get-access-token --resource https://management.azure.com --query accessToken -o tsv)
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            "https://${{ env.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net/api/zipdeploy?isAsync=true" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/deploy.zip \
            --max-time 60)
          echo "Kudu zipdeploy HTTP $HTTP"
          [ "$HTTP" = "202" ] || { echo "Deploy failed with HTTP $HTTP"; exit 1; }

      # Always re-assert startup command so a broken deploy can't leave it wrong.
      - name: Set startup command
        run: |
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --startup-file 'pip install -e ".[api]" && uvicorn tmos_randomizer.api.server:app --host 0.0.0.0 --port 8000'

      - name: Restart app
        run: |
          az webapp restart \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }}
