name: Deploy Backend to Azure App Service

on:
  push:
    branches: [master]
    paths:
      - 'projects/TMOS_Randomizer_V2/src/**'
      - 'projects/TMOS_Randomizer_V2/config/**'
      - 'projects/TMOS_Randomizer_V2/pyproject.toml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: tmos-randomizer-api
  AZURE_RESOURCE_GROUP: tmos-randomizer-rg

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Pack only what the backend needs — exclude ROM, UI, debug scripts, etc.
      - name: Build deployment zip
        run: |
          mkdir -p /tmp/deploy-pkg
          cp -r projects/TMOS_Randomizer_V2/src      /tmp/deploy-pkg/
          cp -r projects/TMOS_Randomizer_V2/config   /tmp/deploy-pkg/
          cp    projects/TMOS_Randomizer_V2/pyproject.toml /tmp/deploy-pkg/
          cp    projects/TMOS_Randomizer_V2/requirements.txt /tmp/deploy-pkg/
          cd /tmp/deploy-pkg && zip -r /tmp/deploy.zip .
          echo "Zip size: $(du -sh /tmp/deploy.zip)"

      # Deploy via Azure CLI (zip deploy REST API) — avoids the SCM/Oryx interaction
      # that caused azure/webapps-deploy@v3 to hang when SCM build was disabled.
      - name: Deploy zip to App Service
        run: |
          az webapp deploy \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --src-path /tmp/deploy.zip \
            --type zip \
            --async false

      # Always re-assert startup command so a bad deploy can't leave it broken.
      - name: Set startup command
        run: |
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --startup-file 'pip install -e ".[api]" && uvicorn tmos_randomizer.api.server:app --host 0.0.0.0 --port 8000'

      - name: Restart app
        run: |
          az webapp restart \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }}
