name: Deploy Backend to Azure App Service

on:
  push:
    branches: [master]
    paths:
      - 'projects/TMOS_Randomizer_V2/src/**'
      - 'projects/TMOS_Randomizer_V2/config/**'
      - 'projects/TMOS_Randomizer_V2/pyproject.toml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: tmos-randomizer-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: projects/TMOS_Randomizer_V2
